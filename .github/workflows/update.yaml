name: Update
on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * *"
jobs:
  build:
    name: Update
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update rule-set branch
        run: |
          ./ruleset_gen
          # Reformat the std::map header into a sorted, constant-initialized
          # std::array (one read-only copy instead of one heap copy per TU).
          python3 format_srslist.py srslist.h
          # Refuse to publish a header that would break every downstream build.
          printf '#include "srslist.h"\nint main(){ return (int)ruleSetList.size(); }\n' > srslist_check.cpp
          g++ -std=c++20 -fsyntax-only -I. srslist_check.cpp && rm srslist_check.cpp
          mkdir -p rule-set
          cd rule-set
          git init
          git config --local user.email "github-action@users.noreply.github.com"
          git config --local user.name "GitHub Action"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git branch -M rule-set
          cp ../srslist.h .
          git add .
          git commit -m "Update rule-set on $(date '+%Y-%m-%d %H:%M')"
          git push -f origin rule-set
