name: Feeds
on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * *"
jobs:
  tor:
    name: Tor
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tor Browser Developers signing key: https://support.torproject.org/tbb/how-to-verify-signature/
      TOR_SIGNING_KEY: EF6E286DDA85EA2A4BA7DE684E2C6E8793298290
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Fetch the published branch
        run: git clone -q --depth 1 --branch tor "https://github.com/${{ github.repository }}" site || mkdir -p site
      - name: Bridges
        run: |
          mkdir -p out
          python3 tor_feed.py site/bridges-v1.json out/bridges-v1.json
          [ -f out/bridges-v1.json ] || cp site/bridges-v1.json out/
      - name: Tor expert bundles
        run: |
          set -euo pipefail
          version=$(curl -fsSL --retry 3 https://aus1.torproject.org/torbrowser/update_3/release/downloads.json | jq -r .version)
          [[ "$version" =~ ^[0-9][0-9a-z.]*$ ]]
          if [ "$(jq -r .version site/downloads.json 2>/dev/null || true)" = "$version" ]; then
            echo "Tor $version is already mirrored"
            cp site/downloads.json site/sha256sums-signed-build.txt site/sha256sums-signed-build.txt.asc site/tor-expert-bundle-*.tar.gz out/
            exit 0
          fi
          dist="https://dist.torproject.org/torbrowser/$version"
          cd out
          curl -fsSLO --retry 3 "$dist/sha256sums-signed-build.txt"
          curl -fsSLO --retry 3 "$dist/sha256sums-signed-build.txt.asc"
          gpg --batch --auto-key-locate nodefault,wkd --locate-keys torbrowser@torproject.org
          gpg --batch --status-fd 1 --verify sha256sums-signed-build.txt.asc sha256sums-signed-build.txt | grep -q "VALIDSIG .* $TOR_SIGNING_KEY$"
          mirrored=0
          for platform in windows-x86_64 windows-i686 macos-aarch64 macos-x86_64 linux-x86_64 linux-aarch64; do
            file="tor-expert-bundle-$platform-$version.tar.gz"
            sum=$(awk -v f="$file" '$2 == f { print $1 }' sha256sums-signed-build.txt)
            if [ -z "$sum" ]; then
              echo "::warning::$file is not in the signed checksums"
              continue
            fi
            curl -fsSLO --retry 3 "$dist/$file"
            echo "$sum  $file" | sha256sum -c -
            mirrored=$((mirrored + 1))
          done
          [ "$mirrored" -gt 0 ]
          printf '{"version":"%s"}\n' "$version" > downloads.json
      - name: Publish
        run: |
          cat > out/README.md <<'EOF'
          Mirror for Throne. `bridges-v1.json` holds Tor's built-in bridges, the per-country bridge settings and the bridge service front, built from the Tor Project's rdsys-admin and Tor Browser sources. The Tor expert bundles and their checksum list come from dist.torproject.org, checked against the Tor Browser Developers signing key before publishing.
          EOF
          sed -i 's/^          //' out/README.md
          bash publish_branch.sh site "$PWD/out" tor

  psiphon:
    name: Psiphon
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Fetch the published branch
        run: git clone -q --depth 1 --branch psiphon "https://github.com/${{ github.repository }}" site || mkdir -p site
      - name: Server list
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fsSL --retry 3 -o out/server_list_compressed "https://s3.amazonaws.com//psiphon/web/mjr4-p23r-puwl/server_list_compressed"
          python3 psiphon_feed.py out/server_list_compressed
      - name: Publish
        run: |
          cat > out/README.md <<'EOF'
          Mirror for Throne of Psiphon's public remote server list. Psiphon clients verify its signature themselves; this copy was checked against the same key before publishing.
          EOF
          sed -i 's/^          //' out/README.md
          bash publish_branch.sh site "$PWD/out" psiphon
